<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Manager Montaj</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f3f4f6;
 color:#111827;
 font-family:Arial,Helvetica,sans-serif;
 padding-bottom:80px
}
header{
 background:#111827;
 color:white;
 padding:22px 18px;
 position:sticky;
 top:0;
 z-index:10
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#cbd5e1}
main{max-width:1100px;margin:auto;padding:18px}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 z-index:20;
 padding:8px
}
nav button{
 border:0;
 background:none;
 font-weight:bold;
 color:#475569;
 padding:8px;
 cursor:pointer
}
nav button.active{color:#2563eb}
.view{display:none}
.view.active{display:block}
.card{
 background:white;
 border:1px solid #ddd;
 border-radius:14px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 2px 8px #0000000b
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px
}
.metric{
 background:white;
 border-radius:14px;
 padding:18px;
 border:1px solid #ddd
}
.metric strong{
 display:block;
 font-size:25px;
 margin-top:5px
}
input,select{
 width:100%;
 padding:12px;
 border:1px solid #cbd5e1;
 border-radius:9px;
 font-size:15px;
 margin-top:5px
}
label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:10px
}
button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 font-size:14px;
 font-weight:bold;
 cursor:pointer
}
.btn{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.orange{background:#d97706;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#111827}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px
}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 font-size:12px;
 font-weight:bold
}
.badge.green{background:#dcfce7;color:#166534}
.badge.orange{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.blue{background:#dbeafe;color:#1e40af}
.row{
 display:flex;
 justify-content:space-between;
 gap:15px;
 padding:11px 0;
 border-bottom:1px solid #e5e7eb
}
.row:last-child{border-bottom:0}
.right{text-align:right}
.empty{
 text-align:center;
 color:#64748b;
 padding:30px
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 align-items:center;
 justify-content:center;
 padding:15px
}
.modal.show{display:flex}
.sheet{
 background:white;
 width:100%;
 max-width:650px;
 max-height:90vh;
 overflow:auto;
 border-radius:15px;
 padding:20px
}
.close{
 float:right;
 background:#e5e7eb
}
h2{margin-top:0}
table{
 width:100%;
 border-collapse:collapse;
 margin-top:12px
}
th,td{
 text-align:left;
 padding:10px;
 border-bottom:1px solid #e5e7eb
}
@media(max-width:600px){
 main{padding:10px}
 .card{padding:14px}
 .metric strong{font-size:21px}
}
</style>
</head>

<body>

<header>
<h1>Manager Montaj</h1>
<p>Gestionare echipe • lucrări • situații • încasări</p>
</header>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="view active">
<h2>Dashboard</h2>

<div class="grid">
<div class="metric">
Lucrări
<strong id="mWorks">0</strong>
</div>

<div class="metric">
Valoare lucrări
<strong id="mValue">0 lei</strong>
</div>

<div class="metric">
Încasat de la clienți
<strong id="mClientPaid">0 lei</strong>
</div>

<div class="metric">
De încasat
<strong id="mClientDebt">0 lei</strong>
</div>
</div>

<div class="card" style="margin-top:15px">
<h2>Ultimele lucrări</h2>
<div id="recentWorks"></div>
</div>
</section>


<!-- LUCRARI -->
<section id="works" class="view">
<h2>Lucrări</h2>

<div class="card">
<h3>Adaugă lucrare</h3>

<label>
Numele lucrării
<input id="workName" placeholder="Ex: Hamburg">
</label>

<label>
Client
<input id="workClient" placeholder="Numele clientului">
</label>

<label>
Valoare totală lucrare
<input id="workValue" type="number" min="0" placeholder="Ex: 50000">
</label>

<button class="btn" onclick="addWork()">+ Adaugă lucrare</button>
</div>

<div id="worksList"></div>
</section>


<!-- ECHIPE -->
<section id="teams" class="view">
<h2>Echipe / Montatori</h2>

<div class="card">
<h3>Adaugă echipă</h3>

<label>
Numele echipei
<input id="teamName" placeholder="Ex: Echipa Marian">
</label>

<button class="btn" onclick="addTeam()">+ Adaugă echipă</button>
</div>

<div id="teamsList"></div>
</section>


<!-- FINANCIAR -->
<section id="finance" class="view">
<h2>Financiar</h2>

<div id="financeContent"></div>
</section>

</main>


<nav>
<button class="active" onclick="showView('dashboard',this)">🏠<br>Acasă</button>
<button onclick="showView('works',this)">🏗️<br>Lucrări</button>
<button onclick="showView('teams',this)">👷<br>Echipe</button>
<button onclick="showView('finance',this)">💰<br>Financiar</button>
</nav>


<!-- MODAL LUCRARE -->
<div id="workModal" class="modal">
<div class="sheet">
<button class="close" onclick="closeModal('workModal')">✕</button>
<div id="workModalContent"></div>
</div>
</div>


<!-- MODAL SITUAȚIE -->
<div id="situationModal" class="modal">
<div class="sheet">
<button class="close" onclick="closeModal('situationModal')">✕</button>
<div id="situationContent"></div>
</div>
</div>


<script>

let db = JSON.parse(localStorage.getItem("managerMontaj")) || {
 works:[],
 teams:[],
 situations:[]
};

function save(){
 localStorage.setItem("managerMontaj",JSON.stringify(db));
 renderAll();
}

function lei(n){
 return Number(n||0).toLocaleString("ro-RO")+" lei";
}

function id(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function showView(name,btn){

 document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
 document.getElementById(name).classList.add("active");

 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 if(btn) btn.classList.add("active");

 renderAll();
}


function addWork(){

 const name=document.getElementById("workName").value.trim();
 const client=document.getElementById("workClient").value.trim();
 const value=Number(document.getElementById("workValue").value||0);

 if(!name){
  alert("Introdu numele lucrării.");
  return;
 }

 db.works.push({
  id:id(),
  name,
  client,
  value,
  created:new Date().toISOString()
 });

 document.getElementById("workName").value="";
 document.getElementById("workClient").value="";
 document.getElementById("workValue").value="";

 save();

 alert("Lucrarea a fost adăugată.");
}


function addTeam(){

 const name=document.getElementById("teamName").value.trim();

 if(!name){
  alert("Introdu numele echipei.");
  return;
 }

 db.teams.push({
  id:id(),
  name
 });

 document.getElementById("teamName").value="";

 save();
}


function getSituations(workId){
 return db.situations.filter(s=>s.workId===workId);
}


function getClientPaid(workId){

 return getSituations(workId)
 .reduce((sum,s)=>sum+Number(s.clientPaid||0),0);
}


function getTeamPaid(workId){

 return getSituations(workId)
 .reduce((sum,s)=>sum+Number(s.teamPaid||0),0);
}


function renderDashboard(){

 document.getElementById("mWorks").textContent=db.works.length;

 const value=db.works.reduce((a,w)=>a+Number(w.value||0),0);
 const paid=db.works.reduce((a,w)=>a+getClientPaid(w.id),0);

 document.getElementById("mValue").textContent=lei(value);
 document.getElementById("mClientPaid").textContent=lei(paid);
 document.getElementById("mClientDebt").textContent=lei(value-paid);

 const recent=document.getElementById("recentWorks");

 if(!db.works.length){
  recent.innerHTML='<div class="empty">Nu există lucrări.</div>';
  return;
 }

 recent.innerHTML=db.works.slice().reverse().slice(0,5).map(w=>{

  const paid=getClientPaid(w.id);
  const debt=Math.max(0,w.value-paid);

  return `
  <div class="row">
   <div>
    <strong>${esc(w.name)}</strong><br>
    <small>${esc(w.client||"Fără client")}</small>
   </div>
   <div class="right">
    ${lei(w.value)}<br>
    <span class="badge ${debt===0?'green':'orange'}">
    ${debt===0?'Achitat':'Rest '+lei(debt)}
    </span>
   </div>
  </div>
  `;
 }).join("");
}


function renderWorks(){

 const box=document.getElementById("worksList");

 if(!db.works.length){
  box.innerHTML='<div class="card empty">Nu există lucrări.</div>';
  return;
 }

 box.innerHTML=db.works.slice().reverse().map(w=>{

  const situations=getSituations(w.id);
  const paid=getClientPaid(w.id);
  const debt=Math.max(0,w.value-paid);

  return `
  <div class="card">

   <h2>${esc(w.name)}</h2>

   <div class="row">
    <span>Client</span>
    <strong>${esc(w.client||"—")}</strong>
   </div>

   <div class="row">
    <span>Valoare lucrare</span>
    <strong>${lei(w.value)}</strong>
   </div>

   <div class="row">
    <span>Încasat</span>
    <strong style="color:#16a34a">${lei(paid)}</strong>
   </div>

   <div class="row">
    <span>Rest de încasat</span>
    <strong style="color:${debt?'#dc2626':'#16a34a'}">${lei(debt)}</strong>
   </div>

   <div style="margin-top:15px">
    <strong>Situații de lucrări</strong>
   </div>

   ${
    situations.length
    ?
    situations.map(s=>`

    <div class="row">
     <div>
      <strong>${esc(w.name)} – Situația nr. ${s.no}</strong><br>
      <small>${formatDate(s.date)}</small>
     </div>

     <div class="right">
      ${lei(s.clientValue)}<br>

      <span class="badge ${
       Number(s.clientPaid)>=Number(s.clientValue)
       ?'green':'orange'
      }">
       Client: ${lei(s.clientPaid)}
      </span>

      <br>

      <span class="badge ${
       Number(s.teamPaid)>=Number(s.teamValue)
       ?'green':'orange'
      }">
       Montatori: ${lei(s.teamPaid)}
      </span>

      <br>

      <button class="gray" onclick="openSituation('${s.id}')">
       Deschide
      </button>
     </div>
    </div>

    `).join("")
    :
    '<div class="empty">Nu există situații pentru această lucrare.</div>'
   }

   <div class="actions">
    <button class="btn" onclick="openNewSituation('${w.id}')">
     📄 + Situație nouă
    </button>

    <button class="gray" onclick="openWork('${w.id}')">
     📊 Detalii
    </button>

    <button class="red" onclick="deleteWork('${w.id}')">
     🗑️ Șterge
    </button>
   </div>

  </div>
  `;
 }).join("");
}


function openNewSituation(workId){

 const w=db.works.find(x=>x.id===workId);
 if(!w)return;

 const situations=getSituations(workId);
 const next=situations.length
  ? Math.max(...situations.map(x=>Number(x.no)))+1
  : 1;

 document.getElementById("situationContent").innerHTML=`

 <h2>${esc(w.name)} – Situația nr. ${next}</h2>

 <label>
 Data
 <input id="sitDate" type="date" value="${new Date().toISOString().slice(0,10)}">
 </label>

 <label>
 Descriere
 <input id="sitDesc" placeholder="Ex: Montaj etaj 1">
 </label>

 <label>
 Valoarea situației pentru client
 <input id="sitClientValue" type="number" min="0">
 </label>

 <label>
 Valoarea pentru montatori
 <input id="sitTeamValue" type="number" min="0">
 </label>

 <div class="actions">
  <button class="btn" onclick="createSituation('${w.id}',${next})">
   Creează situația
  </button>

  <button class="gray" onclick="closeModal('situationModal')">
   Renunță
  </button>
 </div>

 <p>
 <small>
 După creare, situația pentru montatori este generată automat
 pentru aceeași lucrare și același număr de situație.
 </small>
 </p>
 `;

 openModal("situationModal");
}


function createSituation(workId,no){

 const clientValue=Number(document.getElementById("sitClientValue").value||0);
 const teamValue=Number(document.getElementById("sitTeamValue").value||0);

 if(clientValue<=0){
  alert("Introdu valoarea situației.");
  return;
 }

 const s={
  id:id(),
  workId,
  no,
  date:document.getElementById("sitDate").value,
  desc:document.getElementById("sitDesc").value,
  clientValue,
  clientPaid:0,
  teamValue,
  teamPaid:0,
  payments:[]
 };

 db.situations.push(s);

 closeModal("situationModal");
 save();

 alert(
  "Situația nr. "+no+" a fost creată.\n\n"+
  "A fost creată automat și partea pentru montatori."
 );
}


function openSituation(sid){

 const s=db.situations.find(x=>x.id===sid);
 if(!s)return;

 const w=db.works.find(x=>x.id===s.workId);

 const clientDebt=Math.max(0,s.clientValue-s.clientPaid);
 const teamDebt=Math.max(0,s.teamValue-s.teamPaid);

 document.getElementById("situationContent").innerHTML=`

 <h2>${esc(w.name)} – Situația nr. ${s.no}</h2>

 <p>${esc(s.desc||"Fără descriere")}</p>

 <div class="card">
 <h3>💰 Client</h3>

 <div class="row">
  <span>Valoare situație</span>
  <strong>${lei(s.clientValue)}</strong>
 </div>

 <div class="row">
  <span>Încasat</span>
  <strong style="color:#16a34a">${lei(s.clientPaid)}</strong>
 </div>

 <div class="row">
  <span>Rest</span>
  <strong style="color:${clientDebt?'#dc2626':'#16a34a'}">
   ${lei(clientDebt)}
  </strong>
 </div>

 <div class="actions">
  <button class="green" onclick="payClient('${s.id}')">
   💵 Încasează client
  </button>
 </div>
 </div>


 <div class="card">
 <h3>👷 Montatori</h3>

 <div class="row">
  <span>Valoare montatori</span>
  <strong>${lei(s.teamValue)}</strong>
 </div>

 <div class="row">
  <span>Plătit</span>
  <strong style="color:#16a34a">${lei(s.teamPaid)}</strong>
 </div>

 <div class="row">
  <span>Rest</span>
  <strong style="color:${teamDebt?'#dc2626':'#16a34a'}">
   ${lei(teamDebt)}
  </strong>
 </div>

 <div class="actions">
  <button class="btn" onclick="payTeam('${s.id}')">
   👷 Plătește montatori
  </button>
 </div>
 </div>


 <div class="card">
 <h3>📊 Istoric plăți</h3>

 ${
  s.payments.length
  ?
  s.payments.slice().reverse().map(p=>`
   <div class="row">
    <div>
     <strong>${p.type==="client"?"Client":"Montatori"}</strong><br>
     <small>${formatDate(p.date)}</small>
    </div>
    <strong>${lei(p.amount)}</strong>
   </div>
  `).join("")
  :
  '<div class="empty">Nu există plăți.</div>'
 }

 </div>


 <div class="actions">
  <button class="gray" onclick="printSituation('${s.id}')">
   🖨️ Tipărește / PDF
  </button>

  <button class="red" onclick="deleteSituation('${s.id}')">
   🗑️ Șterge situația
  </button>
 </div>
 `;

 openModal("situationModal");
}


function payClient(sid){

 const amount=Number(prompt("Cât a plătit clientul acum?")||0);
 if(amount<=0)return;

 const s=db.situations.find(x=>x.id===sid);

 const remaining=s.clientValue-s.clientPaid;

 if(amount>remaining){
  alert("Suma este mai mare decât restul de plată.");
  return;
 }

 s.clientPaid+=amount;

 s.payments.push({
  type:"client",
  amount,
  date:new Date().toISOString()
 });

 save();
 openSituation(sid);
}


function payTeam(sid){

 const amount=Number(prompt("Cât ai plătit montatorilor acum?")||0);
 if(amount<=0)return;

 const s=db.situations.find(x=>x.id===sid);

 const remaining=s.teamValue-s.teamPaid;

 if(amount>remaining){
  alert("Suma este mai mare decât restul pentru montatori.");
  return;
 }

 s.teamPaid+=amount;

 s.payments.push({
  type:"team",
  amount,
  date:new Date().toISOString()
 });

 save();
 openSituation(sid);
}


function openWork(workId){

 const w=db.works.find(x=>x.id===workId);
 const situations=getSituations(workId);

 document.getElementById("workModalContent").innerHTML=`

 <h2>${esc(w.name)}</h2>

 <p><strong>Client:</strong> ${esc(w.client||"—")}</p>
 <p><strong>Valoare:</strong> ${lei(w.value)}</p>

 <h3>Situații</h3>

 ${
  situations.length
  ?
  situations.map(s=>`
   <div class="row">
    <div>
     <strong>Situația nr. ${s.no}</strong><br>
     ${esc(s.desc||"")}
    </div>
    <div class="right">
     ${lei(s.clientValue)}
    </div>
   </div>
  `).join("")
  :
  '<div class="empty">Nu există situații.</div>'
 }
 `;

 openModal("workModal");
}


function renderTeams(){

 const box=document.getElementById("teamsList");

 if(!db.teams.length){
  box.innerHTML='<div class="card empty">Nu există echipe.</div>';
  return;
 }

 box.innerHTML=db.teams.map(t=>`
  <div class="card">
   <h3>👷 ${esc(t.name)}</h3>
   <button class="red" onclick="deleteTeam('${t.id}')">
    Șterge
   </button>
  </div>
 `).join("");
}


function renderFinance(){

 const box=document.getElementById("financeContent");

 let totalClient=0;
 let totalTeam=0;

 db.situations.forEach(s=>{
  totalClient+=Number(s.clientPaid||0);
  totalTeam+=Number(s.teamPaid||0);
 });

 box.innerHTML=`

 <div class="grid">

  <div class="metric">
   Încasări clienți
   <strong>${lei(totalClient)}</strong>
  </div>

  <div class="metric">
   Plăți montatori
   <strong>${lei(totalTeam)}</strong>
  </div>

  <div class="metric">
   Diferență
   <strong>${lei(totalClient-totalTeam)}</strong>
  </div>

 </div>

 <div class="card" style="margin-top:15px">
 <h3>Toate situațiile</h3>

 ${
  db.situations.length
  ?
  db.situations.slice().reverse().map(s=>{

   const w=db.works.find(x=>x.id===s.workId);
   if(!w)return "";

   return `
   <div class="row">
    <div>
     <strong>${esc(w.name)} – Situația nr. ${s.no}</strong><br>
     Client: ${esc(w.client||"—")}
    </div>

    <div class="right">
     Client: ${lei(s.clientPaid)}<br>
     Montatori: ${lei(s.teamPaid)}
    </div>
   </div>
   `;

  }).join("")
  :
  '<div class="empty">Nu există situații.</div>'
 }
 </div>
 `;
}


function deleteWork(workId){

 if(!confirm("Ștergi lucrarea și toate situațiile ei?"))return;

 db.works=db.works.filter(w=>w.id!==workId);
 db.situations=db.situations.filter(s=>s.workId!==workId);

 save();
}


function deleteTeam(teamId){

 if(!confirm("Ștergi această echipă?"))return;

 db.teams=db.teams.filter(t=>t.id!==teamId);

 save();
}


function deleteSituation(sid){

 if(!confirm("Ștergi această situație și istoricul ei de plăți?"))return;

 db.situations=db.situations.filter(s=>s.id!==sid);

 closeModal("situationModal");
 save();
}


function openModal(id){
 document.getElementById(id).classList.add("show");
}


function closeModal(id){
 document.getElementById(id).classList.remove("show");
}


function formatDate(d){

 if(!d)return "—";

 return new Date(d).toLocaleDateString("ro-RO");
}


function esc(value){

 return String(value||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


function printSituation(sid){

 const s=db.situations.find(x=>x.id===sid);
 const w=db.works.find(x=>x.id===s.workId);

 const html=`
 <!DOCTYPE html>
 <html lang="ro">
 <head>
 <meta charset="UTF-8">
 <title>${esc(w.name)} - Situația nr. ${s.no}</title>
 <style>
 body{font-family:Arial;padding:40px;color:#111}
 h1{margin-bottom:5px}
 table{width:100%;border-collapse:collapse;margin-top:30px}
 td,th{border:1px solid #ccc;padding:12px;text-align:left}
 .right{text-align:right}
 </style>
 </head>
 <body>

 <h1>${esc(w.name)}</h1>
 <h2>Situația de lucrări nr. ${s.no}</h2>

 <p><strong>Client:</strong> ${esc(w.client||"—")}</p>
 <p><strong>Data:</strong> ${formatDate(s.date)}</p>
 <p><strong>Descriere:</strong> ${esc(s.desc||"—")}</p>

 <table>
 <tr>
  <th>Descriere</th>
  <th>Valoare</th>
 </tr>

 <tr>
  <td>Valoare situație client</td>
  <td class="right">${lei(s.clientValue)}</td>
 </tr>

 <tr>
  <td>Încasat</td>
  <td class="right">${lei(s.clientPaid)}</td>
 </tr>
